<style>

  .cellhead button:hover{background:var(--paper)}
  .body{padding:12px 16px 16px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td{padding:4px 0;border-bottom:1px solid #EDF0F5}

  tr.big td{font-size:14px;padding:8px 0}

  .legend{padding:10px 16px 14px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--muted)}
  .legend .ttl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}

  .legend .steps i{flex:1;height:10px;display:block}
  .legend .ends{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

  .legend .rows div{display:flex;align-items:center;gap:7px;padding:1.5px 0;font-variant-numeric:tabular-nums}
  .legend .rows span.sw{width:13px;height:11px;border:1px solid rgba(20,33,58,.18);flex:none}
  .toggles{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--rule);flex-wrap:wrap}
  .toggles button{
    font:inherit;font-size:11px;padding:5px 9px;border:1px solid var(--rule);
    background:#fff;color:var(--ink);border-radius:2px;cursor:pointer;
  }
  .toggles button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .foot{padding:9px 16px 14px;font-size:10.5px;color:var(--muted);line-height:1.5}

  .hintrow{padding:9px 16px;font-size:11px;color:var(--muted)}

  .saves button:disabled{opacity:.55;cursor:progress}
  .saves .note{flex-basis:100%;font-size:10.5px;color:var(--muted);line-height:1.5}

,120,11,2,2],[122,208,133,55,9,8],[122,212,143,11,2,2],[122,213,121,65,10,10],[122,217,120,11,2,2],[122,218,120,29,5,4],[122,223,131,59,9,9],[122,224,120,10,2,1],[123,206,123,11,2,2],[123,207,132,11,2,2],[123,211,134,36,6,5],[123,212,121,22,3,3],[123,213,127,38,6,6],[123,215,135,54,8,8],[123,216,120,7,1,1],[123,220,120,7,1,1],[123,221,125,8,1,1],[123,222,135,10,2,2],[124,205,120,11,2,2],[124,212,120,9,1,1],[124,213,120,8,1,1],[124,214,139,36,6,5],[124,215,125,11,2,2],[125,205,92,19,4,3],[125,210,125,30,5,4],[125,211,120,41,6,6],[125,212,120,69,11,10],[125,215,125,11,2,2],[125,223,120,10,2,2],[126,209,128,10,2,1],[126,210,120,11,2,2],[126,211,120,20,3,3],[126,213,125,41,6,6],[127,210,40,10,2,1],[127,212,111,38,8,6],[127,214,120,21,4,3],[128,214,44,38,8,6],[128,222,127,10,2,1],[129,217,29,10,2,1],[129,220,125,29,6,4],[130,221,65,9,1,1]]},"indicators":["total_pop","total_pop_m","total_pop_f","under1","under1_m","under1_f","under2","under2_m","under2_f","under5","under5_m","under5_f","mwra"],"labels":{"total_pop":"Total population","total_pop_m":"Total population - male","total_pop_f":"Total population - female","under1":"Under 1","under1_m":"Under 1 - male","under1_f":"Under 1 - female","under2":"Under 2","under2_m":"Under 2 - male","under2_f":"Under 2 - female","under5":"Under 5","under5_m":"Under 5 - male","under5_f":"Under 5 - female","mwra":"MWRA"}};
var G = D.grid;                       // null when there was nothing to draw
var view = G ? 'grid' : 'areas';
var picked = null;                    // the grid block currently clicked

// Canvas for the grid — tens of thousands of blocks as real SVG nodes would lock the
// browser up. The blocks are not clickable themselves; the click is worked out from the
// lattice, which is instant no matter how many blocks there are.
var map = L.map('map', {preferCanvas:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:19, crossOrigin:'anonymous'
}).addTo(map);

function N(v){ return Number(v||0).toLocaleString(); }

/* ── colour scales ──────────────────────────────────────────────────────── */
var densities = D.areas.map(function(a){ return a.pop_per_km2; }).filter(function(v){return v>0;});
var maxD = densities.length ? Math.max.apply(null, densities) : 1;
function densityColor(d){
  var t = Math.max(0, Math.min(1, d / (maxD || 1)));
  var stops = [[238,241,246],[228,180,41],[194,74,46]];
  var seg = t < 0.5 ? [stops[0],stops[1],t/0.5] : [stops[1],stops[2],(t-0.5)/0.5];
  var c = seg[0].map(function(v,i){ return Math.round(v + (seg[1][i]-v)*seg[2]); });
  return 'rgb('+c.join(',')+')';
}
function binColor(v){
  if(!G) return '#E4B429';
  for(var i=0;i<G.breaks.length;i++){ if(v <= G.breaks[i]) return G.colors[i]; }
  return G.colors[G.breaks.length];
}

/* ── areas ──────────────────────────────────────────────────────────────── */
var byUnit = {};
D.areas.forEach(function(a){ byUnit[a.area] = a; });

var areaFill = L.geoJSON(D.boundary, {
  style: function(f){
    var a = byUnit[f.properties.unit] || {};
    return {color:'#14213A', weight:1.4, fillColor: densityColor(a.pop_per_km2||0), fillOpacity:.55};
  },
  onEachFeature: function(f, lyr){
    var a = byUnit[f.properties.unit];
    if(!a) return;
    lyr.bindPopup('<b>'+a.area+'</b><br>'+N(a.total_pop)+' people<br>'+N(a.area_km2)+' km\u00B2');
    lyr.on('click', function(e){ L.DomEvent.stopPropagation(e); showArea(a); });
  }
});

var outline = L.geoJSON(D.boundary, {
  interactive:false,
  style:{color:'#14213A', weight:1.6, fill:false}
});

var labelLayer = L.layerGroup();
L.geoJSON(D.boundary, {onEachFeature:function(f, lyr){
  var a = byUnit[f.properties.unit];
  if(!a) return;
  var c = lyr.getBounds().getCenter();
  L.marker(c, {interactive:false, icon:L.divIcon({className:'',
    html:'<div style="font:600 11px Inter,sans-serif;color:#14213A;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;transform:translate(-50%,-50%)">'
         + a.area + '</div>'})}).addTo(labelLayer);
}});

/* ── the population grid ────────────────────────────────────────────────── */
var gridRenderer = L.canvas({padding:0.35});
var gridLayer = L.layerGroup();
var lookup = {};
var pickMark = null;

if(G){
  G.cells.forEach(function(c){
    var la = G.lat0 + c[0]*G.dlat, lo = G.lon0 + c[1]*G.dlon;
    L.rectangle([[la, lo],[la+G.dlat, lo+G.dlon]], {
      renderer: gridRenderer, stroke:false,
      fillColor: binColor(c[3]), fillOpacity:.85, interactive:false
    }).addTo(gridLayer);
    lookup[c[0]+':'+c[1]] = c;
  });
}

function cellBounds(c){
  var la = G.lat0 + c[0]*G.dlat, lo = G.lon0 + c[1]*G.dlon;
  return [[la, lo],[la+G.dlat, lo+G.dlon]];
}

map.on('click', function(e){
  if(view !== 'grid' || !G) return;
  var r = Math.floor((e.latlng.lat - G.lat0) / G.dlat);
  var c = Math.floor((e.latlng.lng - G.lon0) / G.dlon);
  var cell = lookup[r+':'+c];
  if(!cell){ pickCell(null); return; }
  pickCell(cell);
  L.popup({closeButton:true})
   .setLatLng([G.lat0 + (cell[0]+0.5)*G.dlat, G.lon0 + (cell[1]+0.5)*G.dlon])
   .setContent('<b>'+N(cell[3])+'</b> people<br>'+
               (G.scale>1 ? N(cell[2])+' grid cells · ' : '')+
               G.cell_km.toFixed(2)+' km block')
   .openOn(map);
});

function pickCell(cell){
  picked = cell;
  if(pickMark){ map.removeLayer(pickMark); pickMark = null; }
  if(cell){
    pickMark = L.rectangle(cellBounds(cell), {color:'#14213A', weight:2,
                                              fill:false, interactive:false}).addTo(map);
  }
  paintPanel();
}

/* ── panel ──────────────────────────────────────────────────────────────── */
function showArea(a){
  picked = null;
  if(pickMark){ map.removeLayer(pickMark); pickMark = null; }
  document.getElementById('cellhead').innerHTML = '';
  document.getElementById('tip').textContent = 'Click another area for its numbers.';
  var rows = '<tr class="big"><td>'+a.area+'</td><td>'+N(a.total_pop)+'</td></tr>'+
    '<tr><td>Grid cells</td><td>'+N(a.grid_cells)+'</td></tr>'+
    '<tr><td>Area (km\u00B2)</td><td>'+N(a.area_km2)+'</td></tr>'+
    '<tr><td>People / km\u00B2</td><td>'+N(a.pop_per_km2)+'</td></tr>'+
    '<tr><td colspan="2" class="grp">Breakdown</td></tr>';
  D.indicators.forEach(function(k){
    if(k==='total_pop') return;
    rows += '<tr><td>'+D.labels[k]+'</td><td>'+N(a[k])+'</td></tr>';
  });
  document.getElementById('stats').innerHTML = rows;
}

function totalsRows(){
  var t = D.totals;
  return '<tr class="big"><td>Everyone in the boundary</td><td>'+N(t.total_pop)+'</td></tr>'+
    '<tr><td>Areas</td><td>'+N(D.areas.length)+'</td></tr>'+
    '<tr><td>Grid cells counted</td><td>'+N(t.grid_cells)+'</td></tr>'+
    '<tr><td>Area (km\u00B2)</td><td>'+N(t.area_km2)+'</td></tr>'+
    (G ? '<tr><td colspan="2" class="grp">Grid view</td></tr>'+
         '<tr><td>Blocks drawn</td><td>'+N(G.blocks)+'</td></tr>'+
         '<tr><td>Block size</td><td>'+G.cell_km.toFixed(2)+' km</td></tr>'+
         '<tr><td>Busiest block</td><td>'+N(G.max)+' people</td></tr>' : '');
}

function cellRows(){
  var c = picked, rows = '';
  rows += '<tr class="big"><td>People in this block</td><td>'+N(c[3])+'</td></tr>';
  for(var i=1;i<G.keys.length;i++){
    rows += '<tr><td>'+G.labels[G.keys[i]]+'</td><td>'+N(c[3+i])+'</td></tr>';
  }
  var share = D.totals.total_pop ? (c[3] / D.totals.total_pop * 100) : 0;
  rows += '<tr><td>Share of the boundary</td><td>'+share.toFixed(3)+'%</td></tr>'+
    '<tr><td>People / km\u00B2</td><td>'+N(Math.round(c[3] / G.block_km2))+'</td></tr>'+
    (G.scale>1 ? '<tr><td>Grid cells merged</td><td>'+N(c[2])+'</td></tr>' : '')+
    '<tr><td>Centre</td><td>'+(G.lat0+(c[0]+0.5)*G.dlat).toFixed(5)+', '+
      (G.lon0+(c[1]+0.5)*G.dlon).toFixed(5)+'</td></tr>';
  return rows;
}

function paintPanel(){
  var head = document.getElementById('cellhead'), tip = document.getElementById('tip');
  if(view === 'grid' && picked){
    head.innerHTML = '<div class="cellhead"><div><div class="nm">One grid block</div>'+
      '<div class="ty">'+G.cell_km.toFixed(2)+' km across · '+G.block_km2.toFixed(3)+
      ' km\u00B2</div></div><button onclick="pickCell(null)">All areas</button></div>';
    tip.textContent = '';
    document.getElementById('stats').innerHTML = cellRows();
  } else {
    head.innerHTML = '';
    tip.textContent = view === 'grid'
      ? 'Click anywhere on the grid to read that block\u2019s own population.'
      : 'Click an area to see its numbers.';
    document.getElementById('stats').innerHTML = totalsRows();
  }
}

/* ── legend ─────────────────────────────────────────────────────────────── */
function paintLegend(){
  var el = document.getElementById('legend');
  if(view === 'grid' && G){
    var html = '', prev = 0;
    for(var i=0;i<G.colors.length;i++){
      var hi = (i < G.breaks.length) ? Math.round(G.breaks[i]) : null;
      var lo = prev + 1, lbl;
      if(hi === null)      lbl = N(lo)+' +';
      else if(lo >= hi)    lbl = N(hi);
      else                 lbl = N(lo)+' \u2013 '+N(hi);
      if(hi !== null) prev = hi;
      html += '<div><span class="sw" style="background:'+G.colors[i]+'"></span>'+lbl+
              ' people</div>';
    }
    el.innerHTML = '<div class="ttl">People per block</div>'+
      '<div class="rows">'+html+'</div>'+
      '<div style="margin-top:7px">Each block is '+G.cell_km.toFixed(2)+' km across'+
      (G.scale>1 ? ' ('+G.scale+' grid cells wide)' : '')+
      '. Bands are cut at the data\u2019s own quantiles, so both empty countryside and '+
      'dense town blocks stay readable.</div>';
  } else {
    el.innerHTML = '<div class="ttl">Population density</div>'+
      '<div>Fill colour = people / km\u00B2</div><div class="bar"></div>'+
      '<div class="ends"><span>0</span><span>'+N(Math.round(maxD))+'</span></div>';
  }
}

/* ── view switch ────────────────────────────────────────────────────────── */
function setView(v){
  view = v;
  document.getElementById('v-grid').classList.toggle('on', v==='grid');
  document.getElementById('v-area').classList.toggle('on', v==='areas');
  if(v === 'grid'){
    if(map.hasLayer(areaFill)) map.removeLayer(areaFill);
    if(!map.hasLayer(gridLayer)) map.addLayer(gridLayer);
  } else {
    if(map.hasLayer(gridLayer)) map.removeLayer(gridLayer);
    if(!map.hasLayer(areaFill)) map.addLayer(areaFill);
    if(pickMark){ map.removeLayer(pickMark); pickMark = null; }
    picked = null;
  }
  paintLegend();
  paintPanel();
}
document.getElementById('v-grid').onclick = function(){ if(G) setView('grid'); };
document.getElementById('v-area').onclick = function(){ setView('areas'); };
if(!G){
  document.getElementById('v-grid').disabled = true;
  document.getElementById('v-grid').title = 'No grid cells were written for this run';
}

/* ── toggles ────────────────────────────────────────────────────────────── */
[['out', outline], ['lbl', labelLayer]].forEach(function(p){
  var btn = document.getElementById('t-'+p[0]), layer = p[1];
  btn.onclick = function(){
    if(map.hasLayer(layer)){ map.removeLayer(layer); btn.classList.remove('on'); }
    else { map.addLayer(layer); btn.classList.add('on'); }
  };
});

/* ── go ─────────────────────────────────────────────────────────────────── */
outline.addTo(map);
setView(view);
map.fitBounds(outline.getBounds(), {padding:[30,30]});

document.getElementById('sub').textContent =
  D.areas.length.toLocaleString()+' area(s)  ·  '+N(D.total_pop)+' people  ·  '+D.year;
document.getElementById('foot').textContent = G
  ? 'Grid-cell population summed inside each polygon. The grid view draws the estimate '
    + 'cell by cell' + (G.scale>1 ? ', merged '+G.scale+'x to keep the file quick to open' : '')
    + '; every number still comes from the full-resolution cells.'
  : 'Grid-cell population summed inside each polygon. Click a shape for its full breakdown.';

function saveNote(msg){ var el=document.getElementById('save-note'); if(el) el.textContent=msg||''; }
function saveBlob(blob, name){
  var a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function stampName(ext){
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  return SAVE_BASE + '_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
         + '_' + p(d.getHours()) + p(d.getMinutes()) + '.' + ext;
}
(function(){
  var bh = document.getElementById('save-html'), bp = document.getElementById('save-png');
  if(bh) bh.onclick = function(){
    saveBlob(new Blob([SELF_HTML], {type:'text/html;charset=utf-8'}), stampName('html'));
    saveNote('Saved as an HTML file. It opens in any browser and stays clickable — the '
             + 'background map needs a connection, everything else works offline.');
  };
  if(bp) bp.onclick = function(){
    saveNote('Taking the picture…'); bp.disabled = true;
    var done = function(msg){ bp.disabled = false; saveNote(msg); };
    var shoot = function(){
      try{
        html2canvas(document.body, {useCORS:true, backgroundColor:'#ffffff',
                                    scale:2, logging:false}).then(function(canvas){
          canvas.toBlob(function(blob){
            if(!blob){ done('The picture could not be made. Use Save map file instead.'); return; }
            saveBlob(blob, stampName('png'));
            done('Picture saved. It shows the map exactly as it is on screen — pan, zoom '
                 + 'or switch view first to change what is in it.');
          }, 'image/png');
        }).catch(function(){
          done('The picture could not be made here. Use Save map file, or your system '
               + 'screenshot key.');
        });
      }catch(e){
        done('The picture could not be made here. Use Save map file instead.');
      }
    };
    if(window.html2canvas){ shoot(); return; }
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = shoot;
    s.onerror = function(){ done('The picture tool could not be downloaded — no '
                                 + 'connection. Use Save map file instead.'); };
    document.head.appendChild(s);
  };
})();

</script>
</body>
